<template>
    <lightning-card variant="narrow" title="MCA Funded Amounts" icon-name="standard:currency">
        <div class="slds-is-relative slds-p-horizontal_small">
            <template lwc:if={isBusy}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>
            <template lwc:if={loadError}>
                <div class="slds-text-color_error slds-p-vertical_x-small" role="alert">{loadError}</div>
            </template>
            <template lwc:if={isEmpty}>
                <div class="slds-text-align_center slds-p-vertical_small">
                    <p class="slds-text-heading_small">No MCAs on this record yet</p>
                    <p class="slds-text-body_small">Add MCA names in the Obligations section to enter funded amounts.</p>
                </div>
            </template>
            <template lwc:if={hasRows}>
                <div class="slds-border_top slds-border_right slds-border_bottom slds-border_left">
                    <lightning-layout class="slds-theme_shade slds-border_bottom">
                        <lightning-layout-item size={itemSize} class={leftHeaderClass}>
                            <div class="slds-grid slds-text-title_bold">
                                <div class="slds-size_2-of-5">MCA Name</div>
                                <div class="slds-size_3-of-5">Funded Amount ($)</div>
                            </div>
                        </lightning-layout-item>
                        <template lwc:if={isTwoColumn}>
                            <lightning-layout-item size={itemSize} class="slds-p-horizontal_x-small slds-p-vertical_xxx-small">
                                <div class="slds-grid slds-text-title_bold">
                                    <div class="slds-size_2-of-5">MCA Name</div>
                                    <div class="slds-size_3-of-5">Funded Amount ($)</div>
                                </div>
                            </lightning-layout-item>
                        </template>
                    </lightning-layout>
                    <div class={gridClass}>
                        <template for:each={displayRows} for:item="row">
                            <div key={row.key} class={row.cellClass}>
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <div class="slds-size_2-of-5 slds-p-right_x-small slds-hyphenate">{row.mcaName}</div>
                                    <div class="slds-size_3-of-5" title={row.amountTooltip}>
                                        <template lwc:if={row.isEditing}>
                                            <lightning-input
                                                type="number"
                                                formatter="currency"
                                                step="0.01"
                                                min="0"
                                                label={row.inputLabel}
                                                variant="label-hidden"
                                                value={row.value}
                                                data-mca-number={row.mcaNumber}
                                                message-when-range-underflow="Amount cannot be negative."
                                                message-when-step-mismatch="Use up to 2 decimal places."
                                                onchange={handleAmountChange}
                                            ></lightning-input>
                                        </template>
                                        <template lwc:else>
                                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                                <div class="slds-is-relative"
                                                    data-mca-number={row.mcaNumber}
                                                    onmouseenter={handleAmountMouseEnter}
                                                    onmouseleave={handleAmountMouseLeave}>
                                                    <template lwc:if={row.hasAmount}>
                                                        <span class="slds-truncate" style="display:block" title={row.amountTooltip}>
                                                            <lightning-formatted-number value={row.value}
                                                                format-style="currency" currency-code="USD"
                                                                minimum-fraction-digits="2" maximum-fraction-digits="2">
                                                            </lightning-formatted-number>
                                                        </span>
                                                        <template lwc:if={row.showAmountTooltip}>
                                                            <div class="slds-popover slds-popover_tooltip slds-nubbin_bottom-left"
                                                                role="tooltip"
                                                                style="position:absolute;bottom:100%;left:0;z-index:10;white-space:nowrap;overflow:visible">
                                                                <div class="slds-popover__body">{row.amountTooltip}</div>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                                <lightning-button-icon class="slds-m-left_xx-small"
                                                    icon-name="utility:edit" variant="bare" size="small"
                                                    alternative-text={row.editLabel} title={row.editLabel}
                                                    data-mca-number={row.mcaNumber} onclick={handleEdit}>
                                                </lightning-button-icon>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
        <div slot="footer" lwc:if={hasRows} class="slds-grid slds-grid_align-end slds-size_1-of-1">
            <lightning-button label="Cancel" onclick={handleCancel} disabled={isCancelDisabled}></lightning-button>
            <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label="Save"
                onclick={handleSave}
                disabled={isSaveDisabled}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
